<header class="top">
  <div class="brand">
    <button class="burger-btn" type="button" (click)="openDrawer()" aria-label="Toggle navigation">
      <nz-icon nzType="menu" />
    </button>
    <span class="brand-mark">T</span>
    <span class="brand-name">Teach<span class="brand-name-up">Up</span></span>
    <span class="crumb">Admin</span>
  </div>
  <div class="top-right">
    <button class="back-btn" type="button" (click)="navigateToCalendar()">
      <nz-icon nzType="left" />
      <span>Back</span>
    </button>
    <div class="profile-btn">
      <span>A</span>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <app-admin-nav variant="sidebar" (signOut)="signOut()" />
  </aside>

  <main class="main">
    <router-outlet />
  </main>

  <app-admin-drawer [(visible)]="isDrawerVisible" />
</div>
