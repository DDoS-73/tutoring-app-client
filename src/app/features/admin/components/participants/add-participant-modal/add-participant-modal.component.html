<div class="modal-wrapper">
  <!-- Header -->
  <header class="modal-header">
    <div class="avatar-wrap">
      <span class="avatar">{{ initials }}</span>
    </div>
    <div class="header-info">
      <h2 class="header-title">{{ isEdit ? 'Edit Participant' : 'Add Participant' }}</h2>
      <p class="header-subtitle">
        @if (form.controls.name.value) {
          {{ form.controls.name.value }} ·
          {{ form.controls.type.value === EventParticipantType.Student ? 'Student' : 'Group' }}
        } @else {
          {{ isEdit ? '' : 'New Participant' }}
        }
      </p>
    </div>
    <button class="close-btn" type="button" (click)="onClose()" aria-label="Close" [disabled]="isPending()">
      <nz-icon nzType="close" nzTheme="outline" />
    </button>
  </header>

  <app-participant-form [form]="form" [isPending]="isPending()" (save)="onSave()" />

  <!-- Footer -->
  <footer class="modal-footer">
    <div class="footer-right">
      <button class="cancel-btn" type="button" (click)="onClose()" [disabled]="isPending()">Cancel</button>
      <button class="save-btn" type="button" (click)="onSave()" [disabled]="isPending()">
        @if (isPending()) {
          <nz-icon nzType="loading" style="margin-right: 8px" />
        }
        <span>{{ isEdit ? 'Save' : 'Add' }}</span>
      </button>
    </div>
  </footer>
</div>
