<div class="auth-page-container">
  <div class="auth-card-wrapper">
    @if (!isMobile()) {
      <div class="auth-visual-section">
        <app-auth-schedule-panel></app-auth-schedule-panel>
      </div>
    }

    <div class="auth-form-section">
      <div class="mobile-header">
        <div class="mobile-header-content">
          <div class="mobile-brand">
            <div class="logo-box">
              <svg class="logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="2" />
                <path d="M16 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M8 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <circle cx="8" cy="14" r="1.5" fill="currentColor" />
                <circle cx="13" cy="14" r="1.5" fill="currentColor" />
                <circle cx="18" cy="14" r="1.5" fill="currentColor" />
              </svg>
            </div>
            <span class="brand-name">TeachUp</span>
          </div>
          <div class="mobile-header-text">
            <h2 class="mobile-title">{{ mobileTitle() }}</h2>
            <p class="mobile-subtitle">{{ mobileSubtitle() }}</p>
          </div>
        </div>

        @if (isMobile()) {
          <app-auth-schedule-panel class="mobile-decor-panel"></app-auth-schedule-panel>
        }
      </div>

      <div class="auth-form-content">
        <div class="segmented-control">
          <a routerLink="/auth/login" routerLinkActive="active" class="segment-btn">Login</a>
          <a routerLink="/auth/sign-up" routerLinkActive="active" class="segment-btn">Sign up</a>
        </div>

        <div class="form-header">
          <h1 class="form-title">{{ title() }}</h1>
          <p class="form-subtitle">{{ subtitle() }}</p>
        </div>

        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
