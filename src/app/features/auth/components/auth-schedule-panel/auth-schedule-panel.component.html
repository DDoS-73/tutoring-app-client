<div class="schedule-panel">
  <!-- Brand logo container -->
  <div class="brand-header">
    <div class="logo-box">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
        <rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="2"/>
        <path d="M16 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="8" cy="14" r="1.5" fill="currentColor"/>
        <circle cx="13" cy="14" r="1.5" fill="currentColor"/>
        <circle cx="18" cy="14" r="1.5" fill="currentColor"/>
      </svg>
    </div>
    <span class="brand-name">TeachUp</span>
  </div>

  <!-- Weekdays label bar -->
  <div class="weekdays-bar">
    <div class="weekday">M</div>
    <div class="weekday">T</div>
    <div class="weekday">W</div>
    <div class="weekday">T</div>
    <div class="weekday">F</div>
  </div>

  <!-- Grid of coffee event blocks -->
  <div class="blocks-grid">
    <!-- Col 1: Monday -->
    <div class="grid-col Monday">
      <div class="event-block caramel" style="--block-height: 111px; --block-top: 0px;"></div>
      <div class="event-block espresso" style="--block-height: 111px; --block-top: 64px;"></div>
      <div class="event-block mocha" style="--block-height: 111px; --block-top: 64px;"></div>
    </div>

    <!-- Col 2: Tuesday -->
    <div class="grid-col Tuesday">
      <div class="event-block latte" style="--block-height: 170px; --block-top: 117px;"></div>
      <div class="event-block espresso" style="--block-height: 170px; --block-top: 6px;"></div>
    </div>

    <!-- Col 3: Wednesday -->
    <div class="grid-col Wednesday">
      <div class="event-block caramel" style="--block-height: 170px; --block-top: 0px;"></div>
      <div class="event-block cream" style="--block-height: 111px; --block-top: 182px;"></div>
    </div>

    <!-- Col 4: Thursday -->
    <div class="grid-col Thursday">
      <div class="event-block cream" style="--block-height: 228px; --block-top: 176px;"></div>
    </div>

    <!-- Col 5: Friday -->
    <div class="grid-col Friday">
      <div class="event-block cream" style="--block-height: 111px; --block-top: 58px;"></div>
      <div class="event-block latte" style="--block-height: 170px; --block-top: 64px;"></div>
    </div>
  </div>
</div>
