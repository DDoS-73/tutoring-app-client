<div class="login-container">
  <h1>Вхід</h1>

  <form nz-form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <nz-form-item>
      <nz-form-label nzRequired>Email</nz-form-label>
      <nz-form-control nzErrorTip="Введіть коректний email">
        <input nz-input formControlName="email" type="email" placeholder="email@example.com" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzRequired>Пароль</nz-form-label>
      <nz-form-control nzErrorTip="Пароль має містити мінімум 5 символів">
        <input nz-input formControlName="password" type="password" placeholder="Введіть пароль" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <button nz-button nzType="primary" nzBlock [nzLoading]="isLoading()" [disabled]="isLoading()">Увійти</button>
    </nz-form-item>
  </form>
</div>
