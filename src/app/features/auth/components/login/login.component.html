<app-auth-layout
  title="Welcome back to your calendar"
  subtitle="Log in to your calendar and start planning."
  mobileTitle="Welcome back to your calendar"
  mobileSubtitle="Log in to your calendar and start planning."
>
  <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
    <div class="form-group" [class.has-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
      <label class="form-label" for="email">Email</label>
      <div class="input-wrapper">
        <span nz-icon nzType="mail" nzTheme="outline" class="input-icon"></span>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" class="form-input" />
      </div>
      @if (loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')) {
        <span class="error-msg">Email is required</span>
      }
      @if (loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')) {
        <span class="error-msg">Please enter a valid email address</span>
      }
    </div>

    <app-password-field [form]="loginForm" />

    <button type="submit" class="submit-btn" [disabled]="isLoading()">
      <span class="btn-text">
        @if (isLoading()) {
          Logging in...
        } @else {
          Log in
        }
      </span>
      <div class="arrow-circle">
        @if (isLoading()) {
          <div class="spinner"></div>
        } @else {
          <span nz-icon nzType="arrow-right" nzTheme="outline" class="arrow-icon"></span>
        }
      </div>
    </button>
  </form>

  <div class="auth-form-footer">
    <span class="footer-text">New here? <a routerLink="/auth/sign-up" class="footer-link">Sign up</a></span>
  </div>
</app-auth-layout>
