<app-calendar-header (createEvent)="openCreateDialog()" />

<div class="calendar-area">
  <div class="container" #container>
    @for (week of weeks(); track week[0].toISOString(); let i = $index) {
      <app-calendar-body [week]="week" [events]="i === 1 ? (events() ?? []) : []" />
    }
  </div>
  <app-current-hour-line />
</div>
