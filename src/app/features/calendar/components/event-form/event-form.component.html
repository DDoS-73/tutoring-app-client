@if (eventForm) {
<form [formGroup]="eventForm">
  <div class="form-control">
    <p class="custom_input_label">Учень</p>
    <input nz-input [nzAutocomplete]="auto" formControlName="participant" />
    <nz-autocomplete
      [nzDataSource]="options()"
      nzBackfill
      #auto
    ></nz-autocomplete>
  </div>

  <div class="form-control">
    <h2>Дата і час</h2>
    <p class="custom_input_label">Дата</p>
    <nz-date-picker
      [ngModel]="event().startTime"
      [ngModelOptions]="{ standalone: true }"
      nzDisabled
    ></nz-date-picker>
  </div>

  <div class="time-wrapper">
    <div class="form-control">
      <p class="custom_input_label">Час початку</p>
      <nz-time-picker
        nzFormat="HH:mm"
        [nzDisabledHours]="CalendarConfig.disabledHours"
        nzHideDisabledOptions
        [nzMinuteStep]="15"
        formControlName="startTime"
      ></nz-time-picker>
    </div>

    <div class="form-control">
      <p class="custom_input_label">Час закінчення</p>
      <nz-time-picker
        nzFormat="HH:mm"
        [nzDisabledHours]="CalendarConfig.disabledHours"
        nzHideDisabledOptions
        [nzMinuteStep]="15"
        formControlName="endTime"
      ></nz-time-picker>
    </div>
  </div>
</form>
}
