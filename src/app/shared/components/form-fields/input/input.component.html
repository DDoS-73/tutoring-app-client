<mat-form-field appearance="outline" class="full-width" floatLabel="always">
  @if (label) {
    <mat-label>{{ label }}</mat-label>
  }
  <input
    matInput
    [placeholder]="placeholder"
    [formControl]="control"
    [type]="type"
    />
    @if (control?.invalid) {
      <mat-error>
        {{ errorMessage }}
      </mat-error>
    }
  </mat-form-field>
