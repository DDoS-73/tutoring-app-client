<div class="form-group" [class.has-error]="control?.touched && control?.invalid" [formGroup]="form()">
  <label class="form-label" for="password">Password</label>
  <div class="input-wrapper">
    <span nz-icon nzType="lock" nzTheme="outline" class="input-icon"></span>
    <input
      id="password"
      [type]="isPasswordVisible() ? 'text' : 'password'"
      [formControlName]="controlName()"
      placeholder="••••••••"
      class="form-input password-input"
    />
    <button type="button" class="visibility-toggle" (click)="togglePasswordVisibility()">
      @if (isPasswordVisible()) {
        <span nz-icon nzType="eye" nzTheme="outline"></span>
      } @else {
        <span nz-icon nzType="eye-invisible" nzTheme="outline"></span>
      }
    </button>
  </div>
  @if (control?.touched && control?.hasError('required')) {
    <span class="error-msg">Password is required</span>
  }
  @if (control?.touched && control?.hasError('minlength')) {
    <span class="error-msg">Password must be at least {{ minLength() }} characters</span>
  }
</div>
