<input
  [ngxTimepicker]="picker"
  [format]="24"
  [min]="`${CalendarConfig.startHour}:00`"
  [max]="`${CalendarConfig.endHour}:00`"
  [value]="value"
  [disabled]="disabled"
/>
<ngx-material-timepicker
  #picker
  [minutesGap]="15"
  (timeChanged)="onTimeChange($event)"
></ngx-material-timepicker>
